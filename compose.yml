version: "3.9"

networks:
  pawcare-network:

services:

  # MySQL pentru API-Animals
  mysql-animals:
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pawcare-network

  # Microserviciul API-Chat
  api-chat:
    build: ./api-chat
    ports:
      - "7004:7004"
    networks:
      - pawcare-network
    depends_on:
      - mysql-animals

  # Microserviciul API-Animals
  api-animals:
    build: ./api-animals
    ports:
      - "7003:7003"
    networks:
      - pawcare-network
    depends_on:
      - mysql-animals

  # Microserviciul API-Gateway (fără DB)
  api-gateway:
    build: ./api-gateway
    ports:
      - "8060:8060"
    networks:
      - pawcare-network
    depends_on:
      - mysql-animals

  # Microserviciul API-Location (fără DB)
  api-location:
    build: ./api-location
    ports:
      - "7005:7005"
    networks:
      - pawcare-network

  keycloak:
    image: danamihaela9/pawcare:latest
    ports:
      - "8080:8080"
    networks:
      - pawcare-network