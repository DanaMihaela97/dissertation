version: "3.9"

networks:
  pawcare-network:

services:

  # MySQL pentru API-Animals
  mysql-animals:
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 
    ports:
      - "3308:3306"
    volumes:
      - 
    networks:
      - pawcare-network

  # microserviciul API-Chat
  api-chat:
    build: ./api-chat
    ports:
      - "7004:7004"
    networks:
      - pawcare-network
    depends_on:
      - mysql-animals

  # microserviciul API-Animals
  api-animals:
    build: ./api-animals
    ports:
      - "7003:7003"
    networks:
      - pawcare-network
    depends_on:
      - mysql-animals

  # microserviciul API-Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "8060:8060"
    networks:
      - pawcare-network
    depends_on:
      - mysql-animals

  # microserviciul API-Location
  api-location:
    build: ./api-location
    ports:
      - "7005:7005"
    networks:
      - pawcare-network

  keycloak:
    image: 
    ports:
      - "8080:8080"
    networks:
      - pawcare-network
