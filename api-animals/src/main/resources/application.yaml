server:
  port: 7003
spring:
  application:
    name: api-animals
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/disertatie/protocol/openid-connect/certs

  datasource:
    url: jdbc:mysql://localhost:3306/animal_api
    username: root
    password: root
#  jpa:
#    hibernate:
#      ddl-auto: create
  flyway:
    driver-class-name: com.mysql.cj.jdbc.Driver
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

logging.level:
