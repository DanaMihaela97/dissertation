server:
  port: 7003
spring:
  application:
    name: api-animals
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/vetcare/protocol/openid-connect/certs

  datasource:
    url: jdbc:mysql://localhost:3306/animal_api
    username: root
    password: root
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  #      ddl-auto: create
  flyway:
    driver-class-name: com.mysql.cj.jdbc.Driver
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

logging.level:
#  org.springframework.cloud.gateway: DEBUG
#  org.springframework.security: DEBUG
#  org.springframework.web.reactive.function.client: TRACE
  org.flywaydb.core: DEBUG

  # API Keys (external services)
