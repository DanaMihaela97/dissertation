# ===============================================
# CONFIGURARE BAZA DE DATE H2 PENTRU TESTE
# ===============================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.sql.init.mode=always


logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.type.descriptor.sql=TRACE
#
## ===============================================
## SET?RI DE LOGGING PENTRU DEPANARE (DEBUG)
## ===============================================
#
## Nivelul general de logging. DEBUG afiseaza mai multe informatii.
#logging.level.root=DEBUG
#
## Afiseaza detalii despre cererile web (controllere, mapari, etc.)
#logging.level.org.springframework.web=DEBUG
#
## Afiseaza log-uri legate de Spring Security, util pentru a vedea cum se proceseaza token-ul
#logging.level.org.springframework.security=DEBUG
#
## Afiseaza comenzile SQL EXACTE pe care le ruleaza Hibernate
#logging.level.org.hibernate.SQL=DEBUG
#
## Afiseaza VALORILE parametrilor folositi in comenzile SQL de mai sus (foarte util!)
#logging.level.org.hibernate.type.descriptor.sql=TRACE
#
## Afiseaza log-uri despre initializarea bazei de date cu scripturi
#logging.level.org.springframework.jdbc.datasource.init=DEBUG