
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          trusted-proxies: "^10\\.5\\.0\\.\\d{1,3}$"
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ["http://13.61.108.126:3000", "http://localhost:3000", "http://ec2-16-170-160-108.eu-north-1.compute.amazonaws.com:3000"]
                allowedMethods:
                  - DELETE
                  - GET
                  - HEAD
                  - OPTIONS
                  - PATCH
                  - POST
                  - PUT
                  - TRACE
                allowedHeaders:
                  - "*"
                allowCredentials: true
          default-filters:
            - TokenRelay=
          routes:
            - id: api-animals
              uri: http://api-animals:7003
              predicates:
                - Path=/api/animals/**,/api/vaccines/**,/websocket/**,/api/notifications/**
            - id: api-chat
              uri: http://api-chat:7004
              predicates:
                - Path=/api/chat/**,/api/reviews/**,/api/locate/**
  security.oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: http://ec2-13-51-246-3.eu-north-1.compute.amazonaws.com:8080/realms/pawcare/protocol/openid-connect/certs
    client:
      provider:
        keycloak:
          issuer-uri: http://ec2-13-51-246-3.eu-north-1.compute.amazonaws.com:8080/realms/pawcare
      registration:
        keycloak:
          provider: keycloak
          client-id: api-gateway-client
          client-secret: bxSlVZ5gHeVRjT4iFujFNTuUygFTJzG4
          authorization-grant-type: authorization_code
          scope: openid


  datasource:
    url: jdbc:mysql://pawcare-db.cbymoe2yia17.eu-north-1.rds.amazonaws.com:3306/login
    username: admin
    password: A6kS3IEZW7XH31aqcMFH
