    url: jdbc:mysql://mysql-animals:3306/login
    # jdbc:mysql://pawcare-db.cbymoe2yia17.eu-north-1.rds.amazonaws.com:3306/login
    username: root
    password: root
    # admin + A6kS3IEZW7XH31aqcMFH
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

keycloak:
  url: http://keycloak:8080
  realm: pawcare
  admin:
    username: admin
    password: admin
    client-id: admin-cli

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.reactive.function.client: TRACE

server:
  port: 8060

realms_master: http://keycloak:8080/realms/master/protocol/openid-connect/token
