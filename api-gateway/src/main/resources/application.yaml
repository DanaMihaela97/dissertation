
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
              - TRACE
            allowedHeaders:
              - "*"
            allowCredentials: true
      default-filters:
        - TokenRelay=
      routes:
        - id: api-animals
          uri: http://localhost:7003
          predicates:
            - Path=/api/animals/**
        - id: api-chat
          uri: http://localhost:7004
          predicates:
            - Path=/api/chat/**
        - id: api-anamnesis
          uri: http://localhost:7005
          predicates:
            - Path=/api/anamnesis/**
  security.oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: http://localhost:8080/realms/disertatie/protocol/openid-connect/certs
    client:
      provider:
        keycloak:
          issuer-uri: http://localhost:8080/realms/disertatie
      registration:
        keycloak:
          provider: keycloak
          client-id: gateway-client
          client-secret: KFKY61wexbJmQbOnXHyDtQ4tod8Uw33t
          authorization-grant-type: authorization_code
          scope: openid

  datasource:
    url: jdbc:mysql://localhost:3306/login
    username: root
    password: dana
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
    jpa:
      hibernate:
        ddl-auto: create
      properties:
        hibernate.dialect: org.hibernate.dialect.MySQLDialect
      show-sql: true

logging.level:
  org.springframework.cloud.gateway: DEBUG
  org.springframework.security: DEBUG
  org.springframework.web.reactive.function.client: TRACE
server:
  port: 8060