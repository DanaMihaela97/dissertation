
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - TokenRelay=
      routes:
        - id: api-animals
          uri: http://localhost:7003
          predicates:
            - Path=/api/animals/**
        - id: api-chat
          uri: http://localhost:7004
          predicates:
            - Path=/api/chat/**
  security.oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: http://localhost:8080/realms/disertatie/protocol/openid-connect/certs
    client:
      provider:
        keycloak:
          issuer-uri: http://localhost:8080/realms/disertatie
      registration:
        keycloak:
          provider: keycloak
          client-id: gateway-client
          client-secret: J5amjWWXmWQZ10fAxfiOFR0xVCwlOQD4
          authorization-grant-type: authorization_code
          scope: openid

  datasource:
    url: jdbc:mysql://localhost:3306/login
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
    jpa:
      hibernate:
        ddl-auto: create
      properties:
        hibernate.dialect: org.hibernate.dialect.MySQLDialect
      show-sql: true

logging.level:
  org.springframework.cloud.gateway: DEBUG
  org.springframework.security: DEBUG
  org.springframework.web.reactive.function.client: TRACE
server:
  port: 8060