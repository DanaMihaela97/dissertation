spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://13.61.108.126:3000"
                  - "http://localhost:3000"
                  - "http://ec2-16-170-160-108.eu-north-1.compute.amazonaws.com:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                  - HEAD
                  - TRACE
                allowedHeaders:
                  - "*"
                allowCredentials: true

          default-filters:
            - TokenRelay=

          routes:
            - id: api-animals
              uri: http://api-animals:7003
              predicates:
                - Path=/api/animals/**,/api/vaccines/**,/websocket/**,/api/notifications/**
            - id: api-chat
              uri: http://api-chat:7004
              predicates:
                - Path=/api/chat/**,/api/reviews/**,/api/admin/**
            - id: api-location
              uri: http://api-location:7005
              predicates:
                - Path=/api/locate/**

  security.oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: http://keycloak:8080/realms/pawcare/protocol/openid-connect/certs
        # http://ec2-13-51-246-3.eu-north-1.compute.amazonaws.com:8080/realms/pawcare/protocol/openid-connect/certs
    client:
      provider:
        keycloak:
          issuer-uri: http://keycloak:8080/realms/pawcare
          # http://ec2-13-51-246-3.eu-north-1.compute.amazonaws.com:8080/realms/pawcare
      registration:
        keycloak:
          provider: keycloak
          client-id: api-gateway-client
          client-secret: GsMSTNNDPFIRE6ckKNrJwjLX8WVZGntj
          authorization-grant-type: authorization_code
          scope: openid

#
