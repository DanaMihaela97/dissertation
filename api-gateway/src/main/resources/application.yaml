
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ["http://13.61.108.126:3000", "http://localhost:3000"]
            allowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
              - TRACE
            allowedHeaders:
              - "*"
            allowCredentials: true
      default-filters:
        - TokenRelay=
      routes:
        - id: api-animals
          uri: http://api-animals:7003
          predicates:
            - Path=/api/animals/**,/api/vaccines/**,/websocket/**,/api/notifications/**
        - id: api-chat
          uri: http://api-chat:7004
          predicates:
            - Path=/api/chat/**,/api/reviews/**,/api/locate/**
  security.oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: http://172.31.31.52:8080/realms/pawcare/protocol/openid-connect/certs
    client:
      provider:
        keycloak:
          issuer-uri: http://172.31.31.52:8080/realms/pawcare
      registration:
        keycloak:
          provider: keycloak
          client-id: api-gateway-client
          client-secret: bxSlVZ5gHeVRjT4iFujFNTuUygFTJzG4
          authorization-grant-type: authorization_code
          scope: openid


  datasource:
    url: jdbc:mysql://pawcare-db.cbymoe2yia17.eu-north-1.rds.amazonaws.com:3306/login
    username: admin
    password: A6kS3IEZW7XH31aqcMFH
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
